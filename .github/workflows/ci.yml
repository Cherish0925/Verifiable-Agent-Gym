name: Execution and distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercise:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[mcp]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/package_plugin.py
      - run: python scripts/check_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: gym-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exercise
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gym-ubuntu-latest-py3.11
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
