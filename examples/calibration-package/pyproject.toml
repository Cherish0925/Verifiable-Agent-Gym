[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gym-calibration-example"
version = "0.1.0"
description = "Example independently installable sensor calibration task package"
requires-python = ">=3.11"
dependencies = ["verifiable-agent-gym>=0.1,<0.2"]

[project.entry-points."agent_gym.tasks"]
sensor-calibration = "calibration_gym:make"

[tool.setuptools]
py-modules = ["calibration_gym"]
